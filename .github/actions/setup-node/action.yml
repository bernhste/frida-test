name: Setup Test Node.js
description: Setup Node.js
runs:
  using: composite
  steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install Node dependencies
        shell: bash
        run: npm ci
